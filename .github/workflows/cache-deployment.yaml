name: depolyment using cache 
# on: [push]
on:
    push: 
        branches: 
            - main 
            - 'feature/**'
        paths-ignore:
            - '.github/workflow/**'
            - README.md 
    workflow_dispatch:   

jobs:
    test: 
        runs-on: ubuntu-latest 
        steps: 
            - name: "cloning code from git" 
              uses: actions/checkout@v7
            - name: "install node 20 version" 
              uses: actions/setup-node@v7 
              with: 
                 node-version: '20'
            - name: "cache dependency" 
              uses: actions/cache@v6
              with: 
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}     
            - name: "install dependency"
              run: npm ci 
            - name: "run tests" 
              run: npm run test 
    build:
        needs: test
        runs-on: ubuntu-latest 
        steps: 
            - name: "cloning git code" 
              uses: actions/checkout@v7
            - name: "install node 20 version" 
              uses:  actions/setup-node@v7 
              with: 
                node-version: '20'
            - name: "cache dependency" 
              uses: actions/cache@v6
              with: 
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}     
            - name: "install dependency" 
              run: npm ci 
            - name: "build project" 
              run: npm run build    
            - name: "upload artifact" 
              uses: actions/upload-pages-artifact@v3
              with: 
                name: dist-files
                path: build_outputs_folder/
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
          pages: write
          id-token: write
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}  
        
        steps:
           - name: Deploy to GitHub Pages
             id: deployment
             uses: actions/deploy-pages@v4  
             with: 
                token: ${{secrets.GITHUB_TOKEN}}


                
